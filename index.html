<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#04122a">
<title>Artemis · Escáner de inventario</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:radial-gradient(ellipse at top,#0a2a55 0%,#04122a 60%,#020814 100%);color:#e6f0ff;min-height:100vh}
  button{font:inherit;cursor:pointer}
  .top{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:8px;padding:10px 12px;background:rgba(3,14,34,.92);border-bottom:1px solid rgba(79,195,255,.25)}
  .top b{font-size:15px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pill{font-size:12px;font-weight:800;padding:5px 10px;border-radius:999px;white-space:nowrap}
  .p-ok{background:#0e5132;color:#7dffb5}.p-wait{background:#5a4206;color:#ffd36b}.p-off{background:#5b1622;color:#ffb3bc}.p-pau{background:#3d2a6b;color:#d9c8ff}
  .wrap{padding:12px;max-width:560px;margin:0 auto}
  .card{background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.03));border:1px solid rgba(120,180,255,.22);border-radius:18px;padding:14px;margin-bottom:12px}
  .big{width:100%;padding:16px;border-radius:14px;border:1px solid #4fc3ff;background:linear-gradient(#1f6fd1,#164f9c);color:#fff;font-weight:800;font-size:18px}
  .big.g{background:linear-gradient(#25b867,#16864a);border-color:#3ddc84}.big.o{background:transparent;color:#b9d3f5;border-color:rgba(120,180,255,.35)}
  .ub{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:16px;font-size:24px;font-weight:900;letter-spacing:.5px;margin-bottom:10px;border:2px solid #4fc3ff;background:rgba(31,111,209,.25)}
  .ub.no{border-color:#ffd36b;background:rgba(241,181,58,.15);color:#ffd36b;font-size:17px}
  .ub small{font-size:12px;font-weight:600;color:#8fb0d8;display:block;letter-spacing:0}
  #reader{width:100%;border-radius:16px;overflow:hidden;background:#000;min-height:40px;position:relative}
  #reader video{object-fit:cover}
  #reader.on{height:30vh;max-height:240px;min-height:150px}#reader.on>#rdi{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%)}
  #reader.on::after{content:'';position:absolute;left:5%;right:5%;top:50%;height:2px;background:#ff4d5e;box-shadow:0 0 8px #ff4d5e;pointer-events:none}
  .tst{position:fixed;left:10px;right:10px;top:10px;z-index:60;padding:12px 14px;border-radius:16px;font-size:21px;font-weight:900;text-align:center;color:#fff;box-shadow:0 8px 30px rgba(0,0,0,.55);transition:opacity .3s;pointer-events:none;opacity:0}
  .tst.ok{background:#1f9d57}.tst.warn{background:#b97c06}.tst.bad{background:#c43248}.tst small{display:block;font-size:15px;font-weight:700;margin-top:2px}
  .lec{border:2px dashed #4fc3ff;border-radius:16px;padding:14px;text-align:center;font-weight:900;font-size:18px;background:rgba(79,195,255,.08);margin-bottom:8px}.lec.v{border-style:solid;border-color:#3ddc84;background:rgba(61,220,132,.14)}
  .zbar{display:flex;gap:8px;margin:8px 0 2px}.zbar button{flex:1;padding:10px 4px;border-radius:12px;border:1px solid rgba(120,180,255,.4);background:rgba(255,255,255,.07);color:#fff;font-weight:800;font-size:15px}.zbar button.on{background:#ffd36b;color:#04122a}.zbar span{align-self:center;min-width:46px;text-align:center;font-weight:800;color:#8fb0d8;font-size:13px}
  .okh{font-size:15px;font-weight:900;color:#3ddc84;letter-spacing:.3px;margin-bottom:2px}
  .res{display:flex;gap:12px;align-items:center;border-radius:18px;padding:12px;border:2px solid rgba(120,180,255,.25);background:rgba(255,255,255,.05);transition:background .2s,border-color .2s;min-height:120px}
  .res img{width:110px;height:110px;object-fit:contain;border-radius:12px;background:#fff;flex:none}
  .res.ok{background:rgba(37,184,103,.25);border-color:#3ddc84}.res.bad{background:rgba(224,71,90,.28);border-color:#ff7d8c}.res.warn{background:rgba(241,181,58,.22);border-color:#ffd36b}
  .res h2{margin:0;font-size:20px}.res .t{display:inline-block;margin-top:6px;background:#fff;color:#04122a;font-weight:900;font-size:22px;padding:2px 12px;border-radius:10px}
  .mut{color:#8fb0d8;font-size:13px}
  .cnt{display:flex;gap:10px;margin:10px 0}.cnt div{flex:1;text-align:center;background:rgba(255,255,255,.05);border:1px solid rgba(120,180,255,.2);border-radius:14px;padding:8px}
  .cnt b{display:block;font-size:28px}.cnt span{font-size:11px;color:#8fb0d8;text-transform:uppercase;letter-spacing:.5px}
  .acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .acts button{padding:14px 8px;border-radius:14px;border:1px solid rgba(120,180,255,.35);background:rgba(255,255,255,.06);color:#fff;font-weight:800;font-size:15px}
  .acts .fin{background:linear-gradient(#25b867,#16864a);border-color:#3ddc84}
  .list div{display:flex;justify-content:space-between;gap:8px;padding:7px 2px;border-bottom:1px solid rgba(120,180,255,.12);font-size:14px}
  .list .x{opacity:.45;text-decoration:line-through}
  .modal{position:fixed;inset:0;z-index:50;background:rgba(2,8,20,.9);display:flex;align-items:flex-start;justify-content:center;padding:14px;overflow:auto}
  .modal>div{background:#071a38;border:1px solid #4fc3ff;border-radius:18px;padding:16px;width:100%;max-width:520px}
  .in{width:100%;padding:13px;border-radius:12px;border:1px solid rgba(120,180,255,.4);background:rgba(0,0,0,.3);color:#fff;font-size:17px}
  .grp{border:1px solid rgba(120,180,255,.2);border-radius:14px;padding:10px;margin-top:10px;display:flex;gap:10px}
  .grp img{width:70px;height:70px;object-fit:contain;background:#fff;border-radius:10px;flex:none}
  .tallas{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
  .tallas button{min-width:52px;padding:10px 8px;border-radius:10px;border:1px solid #4fc3ff;background:rgba(31,111,209,.3);color:#fff;font-weight:900;font-size:16px}
  .names button{display:block;width:100%;margin:8px 0;padding:16px;border-radius:14px;border:1px solid rgba(120,180,255,.35);background:rgba(255,255,255,.06);color:#fff;font-size:18px;font-weight:800;text-align:left}
  .bar{height:12px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#1f6fd1,#4fc3ff)}
  .banner{padding:12px;border-radius:14px;margin-bottom:10px;font-weight:700}
  .demo{background:#3d2a6b;color:#e6dcff;text-align:center;font-size:12px;padding:4px}
</style>
</head>
<body>
<div id="app"><div class="wrap"><div class="card">Cargando…</div></div></div>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>
(function () {
  'use strict';
  var EXEC = 'https://script.google.com/macros/s/AKfycbyoRhC11wXnd_ZWzVO4QrmIhw19V8KsOvbvRsJjtr_HEKHhk1eUPgINMsgQjItA2jvY/exec';
  var P = new URLSearchParams(location.search), DEMO = P.get('demo') === '1';
  if (P.get('x') && /^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/.test(P.get('x'))) EXEC = P.get('x');
  var LS = function (k, v) { try { if (v === undefined) return localStorage.getItem(k); if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) { return null; } };
  var TOKEN = DEMO ? 'DEMO' : (P.get('s') || LS('aud_s') || '');
  if (P.get('s')) LS('aud_s', P.get('s'));
  var DEV = LS('aud_dev'); if (!DEV) { DEV = 'D' + Math.random().toString(36).slice(2, 10); LS('aud_dev', DEV); }
  var SEQ = Number(LS('aud_seq') || 0);
  var INV = null, USER = '', CAT = [], IDX = {}, MC = {}, UBICS = [], UB = '', Q = [], HIST = [], CNT = { tot: 0, ub: {} }, LAST = { c: '', t: 0 }, FOT = {}, FASE = '', CATF2 = false, UASK = {}, MS = {}, PASK = {}, RC = null, RCI = null, IDX2 = {}, MX = {}, MT = {}, LACC = 0, FSM = false, ZONAS = ['VITRINA', 'PARED', 'MESA', 'ISLA', 'MOSTRADOR', 'EXHIBIDOR'], scanner = null, actx = null, syncing = false, ESTADO = '', ERRSRV = '', LEC = false, KBF = { s: '', t: 0, h: 0 };
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
  var sin0 = function (c) { return String(c == null ? '' : c).trim().replace(/^0+(?=.)/, ''); };
  var K = function (k) { return 'aud_' + k + '_' + TOKEN; };
  LEC = LS('aud_modo') === 'lec';
  /* v93: lector / pistola (teclado): no hace falta tocar ningún campo. Lee lo que llega rápido y termina en Enter o Tab. */
  document.addEventListener('keydown', function (e) {
    if (!INV || !$('lec')) return; var a = document.activeElement; if (a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) return;
    if (document.querySelector('.modal')) return;
    var fin = function () { clearTimeout(KBF.h); var v = KBF.s; KBF.s = ''; if (v.length >= 3) { LAST.c = ''; var l = $('lec'); if (l) { l.classList.add('v'); setTimeout(function () { if ($('lec')) $('lec').classList.remove('v'); }, 500); } onCode(v); } };
    if (e.key === 'Enter' || e.key === 'Tab') { if (KBF.s) { e.preventDefault(); fin(); } return; }
    if (e.key && e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey) { var n = Date.now(); if (n - KBF.t > 300) KBF.s = ''; KBF.s += e.key; KBF.t = n; e.preventDefault();
      clearTimeout(KBF.h); KBF.h = setTimeout(function () { if (KBF.s.length >= 6) fin(); else KBF.s = ''; }, 250); }
  });
  var NOFOTO = 'data:image/svg+xml;utf8,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="110" height="110"><rect width="110" height="110" fill="#e9eef5"/><text x="55" y="50" font-size="30" text-anchor="middle">📷</text><text x="55" y="78" font-size="13" text-anchor="middle" fill="#5b6575" font-family="Arial">Sin foto</text></svg>');

  /* ---------- almacenamiento en el teléfono (IndexedDB para el catálogo y fotos) ---------- */
  var DB = null;
  function idb() { return new Promise(function (ok, ko) { if (DB) return ok(DB); var r = indexedDB.open('artemis_aud', 1); r.onupgradeneeded = function () { r.result.createObjectStore('kv'); }; r.onsuccess = function () { DB = r.result; ok(DB); }; r.onerror = function () { ko(r.error); }; }); }
  function iget(k) { return idb().then(function (db) { return new Promise(function (ok) { var t = db.transaction('kv').objectStore('kv').get(k); t.onsuccess = function () { ok(t.result); }; t.onerror = function () { ok(null); }; }); }).catch(function () { return null; }); }
  function iset(k, v) { return idb().then(function (db) { return new Promise(function (ok) { var t = db.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, k); t.oncomplete = function () { ok(true); }; t.onerror = function () { ok(false); }; }); }).catch(function () { return false; }); }
  function guardar() { LS(K('q'), JSON.stringify(Q)); LS(K('h'), JSON.stringify(HIST.slice(-60))); LS(K('c'), JSON.stringify(CNT)); LS(K('ub'), UB); LS(K('fase'), FASE); LS('aud_seq', String(SEQ)); }
  function recuperar() {
    try { Q = JSON.parse(LS(K('q')) || '[]'); } catch (e) { Q = []; }
    try { HIST = JSON.parse(LS(K('h')) || '[]'); } catch (e) { HIST = []; }
    try { CNT = JSON.parse(LS(K('c')) || '{"tot":0,"ub":{}}'); } catch (e) { CNT = { tot: 0, ub: {} }; }
    UB = LS(K('ub')) || ''; USER = LS(K('u')) || ''; FASE = LS(K('fase')) || '';
    try { UASK = JSON.parse(LS(K('ua')) || '{}'); } catch (e) { UASK = {}; }
    try { PASK = JSON.parse(LS(K('pa')) || '{}'); MS = JSON.parse(LS(K('ms')) || '{}'); } catch (e) { PASK = {}; MS = {}; }
  }
  var ALMACEN = function () { return INV && (INV.lugar === 'PRI_DPAF' || INV.lugar === 'TARPRI'); };
  /* v81: fase sala de ventas (muestras, no suman) o almacén (cajas, sí suman). */
  function elegirFase() {
    pararCam();
    pantalla('<div class="wrap"><div class="card"><h2 style="margin-top:0">¿Qué vas a contar?</h2><div class="mut" style="margin-bottom:12px">Primero la sala de ventas (muestras) y después el almacén (cajas).</div>' +
      '<button class="big g" id="fs" style="margin-bottom:10px">🏪 Sala de ventas · muestras</button><div class="mut" style="margin:-4px 0 14px">Escanea cada muestra exhibida (zapatilla: solo el pie de muestra). Cuenta como 1 unidad.</div>' +
      '<button class="big o" id="fa">📦 Almacén · cajas</button><div class="mut" style="margin-top:6px">Escanea cada caja o prenda por anaquel. Los pies derechos sueltos no se escanean.</div></div></div>');
    $('fs').onclick = function () { fijarFase('S'); }; $('fa').onclick = function () { fijarFase('A'); };
  }
  function fijarFase(f) {
    /* 🔒 v99: el almacén se abre SOLO cuando la sala de ventas está terminada (por este celular o por cualquier compañero). */
    if (f === 'A' && FASE !== 'A' && !LS(K('kd')) && !(ALMACEN() || INV.tipo === 'SORPRESA' || INV.tipo === 'LIBRE')) {
      var pasa = function () { FASE = f; UB = ''; guardar(); principal(); };
      var obliga = function () { conf('🔒 Primero hay que terminar la sala de ventas. Cuando toda la sala esté escaneada, marca "Terminé la sala" y recién se abre el almacén.', finSala2, '🏁 Ya terminé la sala', '🏪 Seguir en la sala', function () { if (!FASE) fijarFase('S'); }); };
      api('salak').then(function (r) { if (r.k) { LS(K('kd'), '1'); avisar('✔ La sala de ventas ya fue terminada' + (r.u ? ' (avisó ' + r.u + ')' : '') + '. Pasas al almacén.'); pasa(); } else obliga(); }).catch(obliga);
      return;
    }
    FASE = f; UB = ''; guardar(); principal();
  }

  /* ---------- servidor ---------- */
  function api(a, extra) {
    if (DEMO) return demoApi(a, extra);
    var body = Object.assign({ a: a, s: TOKEN }, extra || {});
    return fetch(EXEC, { method: 'POST', body: JSON.stringify(body) }).then(function (r) { return r.json(); })
      .then(function (j) { if (!j.ok) throw new Error(j.error || 'Error del servidor'); return j; });
  }

  /* ---------- pantallas ---------- */
  function pantalla(h) { $('app').innerHTML = (DEMO ? '<div class="demo">MODO DEMO · nada se envía a Artemis</div>' : '') + (INV && INV.tipo === 'PRUEBA' ? '<div class="demo" style="background:#7a4b00">🧪 MODO PRUEBA · se muestran cantidades · no cuenta para ninguna tienda</div>' : '') + (INV && INV.tipo === 'LIBRE' ? '<div class="demo" style="background:#1f4f8a">📋 ESCANEO LIBRE · fichero · no cuenta para ninguna tienda</div>' : '') + h; }
  function inicio() {
    recuperar();
    if (!TOKEN) return sinCodigo();
    pantalla('<div class="wrap"><div class="card">⏳ Conectando con el inventario…</div></div>');
    api('join').then(function (r) { INV = r.inv; LS(K('inv'), JSON.stringify(INV)); paso2(); })
      .catch(function (e) {
        var c = LS(K('inv'));
        if (c && !navigator.onLine) { INV = JSON.parse(c); paso2(); return; }
        pantalla('<div class="wrap"><div class="card"><h2>⚠ No se pudo entrar</h2><div>' + esc(e.message) + '</div><br><button class="big" id="rt">Reintentar</button><br><br><button class="big o" id="nq">Escanear otro QR</button></div></div>');
        $('rt').onclick = inicio; $('nq').onclick = function () { LS('aud_s', null); TOKEN = ''; sinCodigo(); };
      });
  }
  function sinCodigo() {
    pantalla('<div class="wrap"><div class="card"><h2 style="margin-top:0">📱 Artemis · Escáner</h2><div class="mut" style="margin-bottom:12px">Escanea el código QR del inventario que muestra la pantalla del coordinador.</div><div id="reader"></div><br><button class="big" id="qs">📷 Escanear QR</button></div></div>');
    $('qs').onclick = function () {
      this.style.display = 'none';
      camara(function (t) { var m = String(t).match(/[?&]s=([\w-]{16,})/); if (m) { pararCam(); LS('aud_s', m[1]); TOKEN = m[1]; inicio(); } }, true);
    };
  }
  function paso2() {
    ESTADO = INV.estado;
    if (INV.estado === 'CERRADO' || INV.estado === 'ANULADO') { pantalla('<div class="wrap"><div class="card"><h2>🏁 Inventario ' + (INV.estado === 'ANULADO' ? 'anulado' : 'cerrado') + '</h2><div>' + esc(INV.nlugar) + ' · ' + esc(INV.id) + '</div><div class="mut">Ya no se pueden enviar escaneos.</div>' + (Q.length ? '<div class="banner" style="background:#5b1622">⚠ Quedaron ' + Q.length + ' escaneos sin enviar en este teléfono. Avisa al coordinador.</div>' : '') + '</div></div>'); return; }
    if (!USER) return elegirNombre();
    cargarCatalogo();
  }
  function elegirNombre() {
    pantalla('<div class="wrap"><div class="card"><h2 style="margin-top:0">👋 ¿Quién eres?</h2><div class="mut">' + esc(INV.nlugar) + ' · ' + esc(INV.id) + '</div><div class="names">' +
      (INV.equipo || []).map(function (n, i) { return '<button data-n="' + i + '">👤 ' + esc(n) + '</button>'; }).join('') +
      '</div><input class="in" id="otro" placeholder="Otro nombre…"><br><br><button class="big" id="okn">Continuar</button></div></div>');
    document.querySelectorAll('[data-n]').forEach(function (b) { b.onclick = function () { fijarNombre(INV.equipo[Number(b.dataset.n)]); }; });
    $('okn').onclick = function () { var n = $('otro').value.trim(); if (n.length < 2) { avisar('Escribe tu nombre'); return; } fijarNombre(n); };
  }
  function fijarNombre(n) { USER = n; LS(K('u'), n); cargarCatalogo(); }
  function cargarCatalogo() {
    pantalla('<div class="wrap"><div class="card"><h2 style="margin-top:0">📦 Preparando el catálogo</h2><div class="mut" id="cm">Buscando en el teléfono…</div><br><div class="bar"><i id="cb" style="width:15%"></i></div></div></div>');
    iget('cat_' + INV.id).then(function (c) {
      if (c && c.rows && c.rows.length) { usarCat(c); return; }
      $('cm').textContent = 'Descargando todos los códigos (solo la primera vez)…'; $('cb').style.width = '45%';
      api('cat').then(function (r) {
        var c2 = JSON.parse(r.cat); $('cb').style.width = '85%'; $('cm').textContent = 'Guardando en el teléfono…';
        iset('cat_' + INV.id, c2).then(function () { usarCat(c2); });
      }).catch(function (e) { $('cm').innerHTML = '❌ ' + esc(e.message) + '<br><br><button class="big" id="rc">Reintentar</button>'; $('rc').onclick = cargarCatalogo; });
    });
  }
  function usarCat(c) {
    CATF2 = c.f === 2; if (!FASE && (ALMACEN() || INV.tipo === 'SORPRESA' || INV.tipo === 'LIBRE')) FASE = 'A'; if (INV.tipo === 'LIBRE' && !UB) UB = 'GENERAL';
    CAT = c.rows; UBICS = c.ubics || []; IDX = {}; IDX2 = {}; MC = {}; MX = c.mx || {};
    CAT.forEach(function (r, i) {
      [r[0], r[1], r[2]].forEach(function (k) { if (!k) return; var a = nk(k); if (IDX[k] == null) IDX[k] = i; if (a && IDX[a] == null) IDX[a] = i; if (/^\d{7,14}$/.test(a) && IDX2[a.slice(0, -1)] == null) IDX2[a.slice(0, -1)] = i; });
      var mc = (r[3] + '-' + r[4]).toUpperCase(); (MC[mc] = MC[mc] || []).push(i);
    });
    if (!FASE) return elegirFase();
    principal();
  }

  /* ---------- pantalla principal ---------- */
  function principal() {
    var S = FASE === 'S';
    pantalla('<div class="top"><b>' + (S ? '🏪 ' : '📦 ') + esc(INV.nlugar) + ' · ' + esc(USER) + '</b><span class="pill p-ok" id="sp">✔</span></div><div class="wrap">' +
      '<div class="banner" style="background:' + (S ? '#3d2a6b' : '#0b3a5c') + ';display:flex;justify-content:space-between;align-items:center;gap:8px"><span>' + (S ? '🏪 SALA DE VENTAS · muestras (cuentan)' : '📦 ALMACÉN · cajas (conteo)') + '</span><a href="#" id="cfase" style="color:#9fd8ff;font-size:13px;white-space:nowrap">cambiar</a></div>' +
